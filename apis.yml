aid: supermetrics
name: Supermetrics
description: >-
  Supermetrics is a marketing intelligence platform that automates the pipeline of
  marketing and advertising data from 100+ sources (Google Ads, Facebook/Meta Ads,
  TikTok, Google Analytics, LinkedIn Ads, and more) into spreadsheets, BI tools, and
  data warehouses. Its public Product API (v2) lets developers query that data
  programmatically over REST, run long-running extracts asynchronously, and manage
  teams, saved queries, data-source logins, and Data Warehouse backfills via a
  Management API. Authentication is by API key (Bearer) or a full OAuth2/OIDC flow, and
  Supermetrics also ships an official Python SDK, a Go CLI, an n8n node, and a hosted
  MCP server for connecting AI assistants to live marketing data.
