notes: >-
  Supermetrics publishes two self-serve packages (Starter, Growth) with list prices and a
  quote-only Enterprise tier. Yearly billing is advertised at a 20% saving. Prices shown
  are "from" prices — every package is customizable with paid extras (additional data
  sources, users, accounts per data source, destinations). "Data API access" is listed as
  an extra on Starter and Growth and as an included entitlement on Enterprise; Management
  API access is Enterprise-only, which is the boundary that matters for API consumers.
