notes: >-
  api.supermetrics.com publishes OIDC discovery and RFC 8414 authorization-server metadata
  advertising authorization_code + refresh_token grants, PKCE (S256), Dynamic Client
  Registration (RFC 7591) and 13 scopes. mcp.supermetrics.com additionally publishes RFC 9728
  protected-resource metadata naming that same authorization server and 11 scopes — the
  discovery chain an MCP client walks after the 401 challenge on /mcp. The marketing host
  serves the RFC 9116 security.txt. No /.well-known/api-catalog, no ai-plugin.json, and no
  A2A agent card on any host: both agent-card paths were probed on all six hosts and every
  200 came from a soft-200 or SPA catch-all, so nothing was saved to a2a/.
